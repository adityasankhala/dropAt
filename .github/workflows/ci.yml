name: Continuous integration

on:
  pull_request:
  push:
    branches: [main, feature/**]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dropat_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dropat_backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app migrations
      - run: pytest -q

  user-app:
    name: User app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dropat_user
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  driver-app:
    name: Driver app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dropat_driver
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
