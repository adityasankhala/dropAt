<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DropAt Admin{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --green-50: #f0fdf4;
            --green-500: #22c55e;
            --green-700: #15803d;
            --red-50: #fef2f2;
            --red-500: #ef4444;
            --red-700: #b91c1c;
            --amber-50: #fffbeb;
            --amber-500: #f59e0b;
            --amber-700: #b45309;
            --sidebar-w: 240px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--gray-100);
        }

        .sidebar-logo svg {
            width: 28px;
            height: 28px;
            color: var(--blue-600);
        }

        .sidebar-logo span {
            font-size: 17px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }

        .sidebar-nav { padding: 12px; flex: 1; }

        .nav-section {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 12px 6px;
        }

        .nav-section:first-child { padding-top: 4px; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--gray-600);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
        }

        .nav-item:hover { background: var(--gray-50); color: var(--gray-900); }

        .nav-item.active {
            background: var(--blue-50);
            color: var(--blue-700);
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-100);
            font-size: 12px;
            color: var(--gray-400);
        }

        /* ── Main ── */
        .main { margin-left: var(--sidebar-w); flex: 1; }

        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--gray-900);
            letter-spacing: -0.3px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--green-700);
            background: var(--green-50);
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 500;
        }

        .header-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-500);
        }

        .content { padding: 24px 32px; }

        /* ── Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            padding: 16px 20px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-500);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--gray-900);
            letter-spacing: -0.5px;
        }

        /* ── Card / Table ── */
        .card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-top {
            padding: 14px 20px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-top h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-800);
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            text-align: left;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-500);
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        tbody td {
            padding: 12px 20px;
            font-size: 13px;
            color: var(--gray-700);
            border-bottom: 1px solid var(--gray-100);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--gray-50); }

        .cell-main { color: var(--gray-900); font-weight: 500; }
        .cell-sub { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
        .cell-mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }

        /* ── Badges ── */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-green { background: var(--green-50); color: var(--green-700); }
        .badge-red { background: var(--red-50); color: var(--red-700); }
        .badge-amber { background: var(--amber-50); color: var(--amber-700); }
        .badge-blue { background: var(--blue-50); color: var(--blue-700); }
        .badge-gray { background: var(--gray-100); color: var(--gray-600); }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
            text-decoration: none;
            line-height: 1;
        }

        .btn-primary {
            background: var(--gray-900);
            color: var(--white);
            border-color: var(--gray-900);
        }

        .btn-primary:hover { background: var(--gray-700); }

        .btn-secondary {
            background: var(--white);
            color: var(--gray-700);
            border-color: var(--gray-300);
        }

        .btn-secondary:hover { background: var(--gray-50); }

        .btn-danger {
            background: var(--white);
            color: var(--red-700);
            border-color: var(--gray-300);
        }

        .btn-danger:hover { background: var(--red-50); border-color: var(--red-500); }

        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn svg { width: 14px; height: 14px; }

        /* ── Forms ── */
        .form-group { margin-bottom: 14px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 4px;
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--white);
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            color: var(--gray-900);
            transition: border-color 0.15s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--blue-500);
            box-shadow: 0 0 0 3px var(--blue-100);
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* ── Modal ── */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 100;
            align-items: flex-start;
            justify-content: center;
            padding-top: 80px;
        }

        .overlay.open { display: flex; }

        .dialog {
            background: var(--white);
            border-radius: 10px;
            width: 440px;
            max-width: 92vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }

        .dialog-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gray-100);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dialog-head h3 { font-size: 15px; font-weight: 600; }

        .dialog-close {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 2px;
            line-height: 1;
        }

        .dialog-close:hover { color: var(--gray-700); }
        .dialog-body { padding: 20px; }

        .dialog-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--gray-100);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ── Empty ── */
        .empty {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-400);
        }

        .empty svg { width: 40px; height: 40px; margin-bottom: 12px; }
        .empty p { font-size: 14px; }

        /* ── Avatar ── */
        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--gray-200);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--gray-600);
            flex-shrink: 0;
        }

        /* ── Toolbar ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .toolbar-count {
            font-size: 13px;
            color: var(--gray-500);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { margin-left: 0; }
            .content { padding: 16px; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>DropAt</span>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section">Overview</div>
            <a href="/admin" class="nav-item {% if page == 'dashboard' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>

            <div class="nav-section">Manage</div>
            <a href="/admin/routes" class="nav-item {% if page == 'routes' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v3c0 3.314 2.686 6 6 6h3"/></svg>
                Routes
            </a>
            <a href="/admin/trips" class="nav-item {% if page == 'trips' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Trips
            </a>
            <a href="/admin/bookings" class="nav-item {% if page == 'bookings' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                Bookings
            </a>

            <div class="nav-section">People</div>
            <a href="/admin/users" class="nav-item {% if page == 'users' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Users
            </a>
            <a href="/admin/drivers" class="nav-item {% if page == 'drivers' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                Drivers
            </a>

            <div class="nav-section">Marketing</div>
            <a href="/admin/vouchers" class="nav-item {% if page == 'vouchers' %}active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/><path d="M2 8h20v4H2z" fill="none"/><path d="M12 2v6"/><path d="M12 14v6"/></svg>
                Vouchers
            </a>
        </div>
        <div class="sidebar-footer">DropAt v1.0</div>
    </nav>

    <div class="main">
        <div class="header">
            <h1>{% block page_title %}Dashboard{% endblock %}</h1>
            <div class="header-badge">Online</div>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).classList.add('open'); }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        document.querySelectorAll('.overlay').forEach(el => {
            el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
